name: build-dir882-lzma

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-distutils rsync unzip zlib1g-dev file wget swig

      - name: Clone OpenWrt v24.10.7 (pinned tag)
        run: |
          git clone --depth 1 -b v24.10.7 https://github.com/openwrt/openwrt.git owrt

      - name: Add pinned AmneziaWG v2 package sources
        run: |
          git clone --depth 1 --branch v24.10.7 https://github.com/Slava-Shchipunov/awg-openwrt.git awg
          test "$(git -C awg rev-parse HEAD)" = "d95099d6f4d8c4ec8eaea8d9896136b0c6bfa6cc"
          cp -a awg/kmod-amneziawg owrt/package/
          cp -a awg/amneziawg-tools owrt/package/
          cp -a awg/luci-proto-amneziawg owrt/package/

      - name: Use generic ChaCha20 and Poly1305 kernel libraries on MT7621
        run: |
          cd owrt
          f=package/kernel/linux/modules/crypto.mk
          # OpenWrt 24.10.7 expects optional MIPS acceleration modules here,
          # but this configuration produces the generic library modules instead.
          # Keep the crypto packages and omit only the architecture overrides.
          sed -i '/define KernelPackage\/crypto-lib-chacha20\/mips32r2/,/^endif$/d' "$f"
          sed -i '/define KernelPackage\/crypto-lib-poly1305\/mips$/,/^KernelPackage\/crypto-lib-poly1305\/mips64el=/d' "$f"
          ! grep -q 'chacha-mips.ko' "$f"
          ! grep -q 'poly1305-mips.ko' "$f"

      - name: Patch dir-882-a1 to use lzma-loader
        run: |
          cd owrt
          f=target/linux/ramips/image/mt7621.mk
          awk '
          /define Device\/dlink_dir-882-a1/ { inblk=1 }
          inblk && /^endef/ { print "  $(Device/uimage-lzma-loader)"; inblk=0 }
          { print }
          ' "$f" > "$f.new" && mv "$f.new" "$f"
          echo "==== recipe ===="
          grep -n -A 25 'define Device/dlink_dir-882-a1' "$f"

      - name: Patch flash layout to firmware @ 0x50000 (match Breed)
        run: |
          cd owrt
          g=target/linux/ramips/dts/mt7621_dlink_flash-16m-a1.dtsi
          sed -i 's/reg = <0x40000 0x20000>;/reg = <0x40000 0x10000>;/' "$g"
          sed -i 's/partition@60000 {/partition@50000 {/' "$g"
          sed -i 's/reg = <0x60000 0xfa0000>;/reg = <0x50000 0xfb0000>;/' "$g"
          sed -i '/openwrt,padding = <96>;/d' "$g"
          echo "==== patched flash layout (firmware @ 0x50000, padding removed) ===="
          grep -n -E 'partition@|label|reg = <0x|padding' "$g"

      - name: Bake default LAN IP 192.168.199.1
        run: |
          cd owrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-set-lan-ip <<'EOF'
          uci -q set network.lan.ipaddr='192.168.199.1'
          uci -q commit network
          exit 0
          EOF
          echo "==== baked uci-defaults/99-set-lan-ip ===="
          cat files/etc/uci-defaults/99-set-lan-ip

      - name: Update & install feeds
        run: |
          cd owrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (.config) + ccache
        run: |
          cd owrt
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_dlink_dir-882-a1=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          # File transfer for modern scp clients (SFTP over the existing Dropbear SSH server)
          CONFIG_PACKAGE_openssh-sftp-server=y
          # AmneziaWG v2, built with this firmware so the kernel ABI matches
          # Keep kernel IPv6 enabled because the AWG module links both UDP tunnel helpers;
          # the IPv6 client/server packages below remain excluded from the final image.
          CONFIG_IPV6=y
          CONFIG_PACKAGE_kmod-udptunnel4=y
          CONFIG_PACKAGE_kmod-udptunnel6=y
          CONFIG_PACKAGE_kmod-crypto-kpp=y
          CONFIG_PACKAGE_kmod-crypto-lib-chacha20=y
          CONFIG_PACKAGE_kmod-crypto-lib-poly1305=y
          CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=y
          CONFIG_PACKAGE_kmod-crypto-lib-curve25519=y
          CONFIG_PACKAGE_kmod-amneziawg=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          CONFIG_CCACHE=y
          # --- trims (remove unused -> leaner squashfs) ---
          # luci over plain HTTP only (no SSL/TLS UI); i18n stays English-only (no extra lang packs are default)
          # CONFIG_PACKAGE_luci-ssl is not set
          # no PPP / PPPoE (WAN = DHCP from upstream)
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_ppp-mod-pppoe is not set
          # CONFIG_PACKAGE_kmod-ppp is not set
          # CONFIG_PACKAGE_kmod-pppoe is not set
          # CONFIG_PACKAGE_kmod-pppox is not set
          # no USB storage (HDD lives on the Pi)
          # CONFIG_PACKAGE_kmod-usb-storage is not set
          # CONFIG_PACKAGE_kmod-usb-storage-uas is not set
          # CONFIG_PACKAGE_block-mount is not set
          # CONFIG_PACKAGE_kmod-fs-ext4 is not set
          # CONFIG_PACKAGE_kmod-fs-vfat is not set
          # no IPv6 service
          # CONFIG_PACKAGE_odhcpd-ipv6only is not set
          # CONFIG_PACKAGE_odhcp6c is not set
          EOF
          make defconfig

      - name: Cache downloads (dl/)
        uses: actions/cache@v4
        with:
          path: owrt/dl
          key: owrt-dl-2410-${{ hashFiles('owrt/.config') }}
          restore-keys: |
            owrt-dl-2410-

      - name: Cache ccache (.ccache)
        uses: actions/cache@v4
        with:
          path: owrt/.ccache
          key: owrt-ccache-2410-${{ github.run_id }}
          restore-keys: |
            owrt-ccache-2410-

      - name: Download sources
        run: |
          cd owrt
          make download -j8 || make download -j1 V=s

      - name: Prepare and verify the AWG kernel dependencies
        run: |
          cd owrt
          make target/linux/prepare -j$(nproc)
          kconfig=$(find build_dir/target-mipsel_24kc_musl/linux-ramips_mt7621 -path '*/linux-6.6.141/.config' -print -quit)
          test -n "$kconfig"
          grep -E '^(CONFIG_IPV6|CONFIG_NET_UDP_TUNNEL|CONFIG_CRYPTO_KPP|CONFIG_CRYPTO_LIB_CHACHA20POLY1305|CONFIG_CRYPTO_LIB_CURVE25519)=' "$kconfig"
          grep -Eq '^CONFIG_NET_UDP_TUNNEL=[my]$' "$kconfig"
          grep -Eq '^CONFIG_CRYPTO_LIB_CHACHA20POLY1305=[my]$' "$kconfig"
          grep -Eq '^CONFIG_CRYPTO_LIB_CURVE25519=[my]$' "$kconfig"

      - name: Build
        run: |
          cd owrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect images
        run: |
          cd owrt
          mkdir -p ../out
          cp -v bin/targets/ramips/mt7621/*dir-882-a1*initramfs*.bin ../out/ || true
          cp -v bin/targets/ramips/mt7621/*dir-882-a1*sysupgrade.bin ../out/ || true
          echo "==== artifacts ===="
          ls -la ../out

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: dir882-padfix-0x50000
          path: out/*
          if-no-files-found: error
